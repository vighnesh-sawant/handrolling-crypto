name: Deploy Crypto Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build Benchmark (AVX2)
        run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3

      - name: Run Benchmark & Save JSON
        run: |
          ./zig-out/bin/handrolling_crypto > dashboard/data.json
          
          ls -lh dashboard/data.json
          head -n 5 dashboard/data.json

      - name: Build WASM Module

        run: |
          zig build-exe src/wasm_exports.zig \
            -target wasm32-freestanding \
            -rdynamic \
            -fno-entry \
            -O ReleaseFast \
            -mcpu=mvp+simd128 \
            --name wasm_exports
          
          mv wasm_exports.wasm dashboard/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
